name: Build
on:
  pull_request:


jobs:
  first_job:
    runs-on: ubuntu-latest
    steps:
      - name: Print Something
        run: echo "First message"
      - name: Print multiple lines
        run: |
          echo "First line of multiple lines"
          echo "Second line"
  second_job:
    runs-on: ubuntu-latest
    needs: first_job
    steps:
      - name: Second Job Steps
        run: echo "Second Job steps running"